version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: kangoo-local-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: default
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./Dump20250819.sql:/docker-entrypoint-initdb.d/Dump20250819.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
